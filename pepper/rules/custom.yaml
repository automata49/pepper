# 시트 고유 항목, 입력값 해석, 종합 점수, 적정주가 라벨.
profile: custom
title: Pepper 공통 설정
version: 2026.09.1

inputs:
  # 외부 "EPS 성장 전망(3년)" 값의 의미. 출처가 정의를 밝히지 않아 보수적으로 누적으로 봅니다.
  # cumulative: 3년 누적 → CAGR = (1+g)^(1/3)-1   /   cagr: 이미 연평균
  # 연도별 컨센서스 EPS(eps_forecast)가 있으면 그 값을 우선 사용합니다.
  eps_growth_3y_basis: cumulative
  blended_eps_weights: {normalized: 0.5, consensus: 0.5}   # 종목별 값은 facts.blend_weights로 덮어씀

# 전략별 종합 점수. 대가별 점수는 항상 따로도 표시합니다.
composites:
  swing:
    minervini: 1.0
  position:
    buffett: 0.4
    fisher: 0.3
    lynch: 0.3

# 적정주가(Fair Value) 결정과 라벨
fair_value:
  method: min                # min(보수적) | buffett | lynch | mean
  cheap_discount: 0.25       # 적정가 대비 25% 이상 싸면 CHEAP (Buffett 안전마진)
  expensive_premium: 0.10    # 적정가보다 10% 넘게 비싸면 EXPENSIVE

# 4대가 기준이 없는 시트 항목: 참고값으로만 표시, 점수 미반영
reference:
  fibonacci:
    upper_level: 0.618       # 1년·6개월 가격범위의 61.8% 수준 평균
    mid_level: 0.5           # 1년·6개월 중간값 평균
    windows_bars: [252, 126]

# 데이터 신선도
freshness:
  max_price_age_days: 4
  max_fundamental_age_days: 45     # 시트 '데이터 경과일' 기준

# 개별 기준값 덮어쓰기(선택). 예시:
# overrides:
#   - {profile: lynch, criterion: peg, field: weight, value: 2}
#   - {profile: buffett, criterion: roe_consistency, field: bands,
#      value: [{min: 0.18, score: 100, label: 우수}, {score: 0, label: 미달}]}
overrides: []
