# 예외 태그. 태그가 붙으면 criteria의 skip_if에 따라 N_A 처리합니다.
# when: facts 값으로 자동 판정 (값이 없으면 태그 미부여)
# tickers: 수동 지정 / facts.tags에 직접 넣어도 됩니다.
version: 2026.09.1

tags:
  negative_equity:
    label: 음수 자기자본 — ROE·PBR·부채비율 비교 제외
    when: "equity <= 0"
  negative_eps:
    label: 적자(TTM EPS ≤ 0) — PER·PEG 계산 제외
    when: "eps_ttm <= 0"
  nav_company:
    label: 자산 보유회사 — P/E 대신 NAV/mNAV 평가
    when: "asset_type == 'crypto_treasury'"
    tickers: [MSTR, BMNR]
  cyclical:
    label: 경기순환주 — PEG 대신 사이클 위치 점검 (Lynch)
    tickers: [MU, SNDK, '000660', '005930']
  financial:
    label: 금융업 — 매출총이익률·재고·부채비율 기준 제외
    when: "sector == 'Financials'"
  no_rd_disclosure:
    label: R&D 미공시
    when: "rd_expense_missing"
