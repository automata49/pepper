# Pepper Watchlist 설정
# - etfs: 항상 포함되는 기본 ETF (기존 시트 Price_US/Price_KR의 ETF 목록 + 추가 테마 4개)
#   빼고 싶으면 해당 줄에 enabled: false 추가
#   leveraged: 배수 → RS 순위에서 제외, 지표는 표시
#   holdings: 구성 종목 자료 출처 (globalx | vaneck | kodex | false). DRAM은 ETF만 유지 (구성 종목 수집 안 함)
# - 개별 주식: 시트 Watchlist 탭에서 enabled 체크한 종목만 추가 (--sheets), 또는 아래 stocks에 직접 적기
version: 2026.09.1

benchmarks:
  US: {ticker: SPY, name: S&P 500 (SPY)}
  KR: {ticker: KOSPI, name: 코스피 지수}

history_days: 400          # 약 1년 반 (MA200·52주·12개월 RS 계산용)

indicators:
  rsi_period: 14
  macd: [12, 26, 9]
  stoch_slow: [14, 3, 3]
  rsi_overbought: 70
  rsi_oversold: 30
  stoch_overbought: 80
  stoch_oversold: 20
  rs_weights: {rs_3m: 0.4, rs_6m: 0.2, rs_12m: 0.4}

# 가격 데이터 출처 우선순위 (공식 → 비공식). 키가 없는 출처는 건너뜁니다.
price_sources:
  KR: [krx_openapi, fdr]     # krx_openapi: KRX_API_KEY 필요 / fdr: 네이버 기반(비공식)
  US: [fdr]                  # fdr: Yahoo 기반(비공식). 미국은 무료 공식 일봉 API가 없어 출처를 표시만 함

stocks: []                 # 예: [{ticker: NVDA, market: US}, {ticker: "005930", market: KR}]

